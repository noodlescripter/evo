name: SonarCloud

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}
        with:
          args: >
            -Dsonar.projectKey=YOUR_ORG_evo
            -Dsonar.organization=YOUR_ORG
            -Dsonar.sources=src,electron
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/release/**
