on:
  # Trigger analysis when pushing to your main branches, and when creating a pull request.
  push:
    branches:
      - develop
      - master  
      - 'releases/**'
  pull_request:
      types: [opened, synchronize, reopened]

name: Main Workflow
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.0.0 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}
      with:
        args: >
            -Dsonar.projectKey=nullruntime-dev
            -Dsonar.organization=nullruntime-dev
            -Dsonar.sources=src,electron
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/release/**

    - name: SonarQube Results Summary
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}
      run: |
        echo "## SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        METRICS=$(curl -s -u "$SONAR_TOKEN:" \
          "https://sonarcloud.io/api/measures/component?component=nullruntime-dev&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density")

        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bugs | $(echo $METRICS | jq -r '.component.measures[] | select(.metric=="bugs") | .value // "N/A"') |" >> $GITHUB_STEP_SUMMARY
        echo "| Vulnerabilities | $(echo $METRICS | jq -r '.component.measures[] | select(.metric=="vulnerabilities") | .value // "N/A"') |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Smells | $(echo $METRICS | jq -r '.component.measures[] | select(.metric=="code_smells") | .value // "N/A"') |" >> $GITHUB_STEP_SUMMARY
        echo "| Coverage | $(echo $METRICS | jq -r '.component.measures[] | select(.metric=="coverage") | .value // "N/A"')% |" >> $GITHUB_STEP_SUMMARY
        echo "| Duplication | $(echo $METRICS | jq -r '.component.measures[] | select(.metric=="duplicated_lines_density") | .value // "N/A"')% |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[View Full Dashboard](https://sonarcloud.io/project/overview?id=nullruntime-dev)" >> $GITHUB_STEP_SUMMARY
